{% extends "base.html" %}
{% block title %}Login – Wood Market{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Log In</h1>
    <form method="POST" class="auth-form">
        <label>
            Username
            <input type="text" name="username" required autofocus>
        </label>
        <label>
            Password
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn-primary btn-block">Log In</button>
    </form>
    <p class="auth-footer">
        Don’t have an account? <a href="{{ url_for('register') }}">Register</a>
    </p>
    <p class="auth-hint">
        Default demo seller: <code>admin</code> / <code>adminpass</code>
    </p>
</div>
{% endblock %}
